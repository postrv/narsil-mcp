name: Build Binaries

on:
  workflow_call:
    inputs:
      features:
        description: 'Cargo features to enable'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Use the same userspace on both Linux architectures. Building on
          # ubuntu-latest/24.04 requires GLIBC 2.39, which excludes Debian 12.
          - os: ubuntu-22.04
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            artifact: narsil-mcp-linux-x86_64
            binary: narsil-mcp
          # Native ARM64 Linux build via GitHub-hosted Graviton runners.
          # No cross-compile toolchain required — addresses issue #20
          # for Raspberry Pi, AWS Graviton, and Apple-silicon-via-Docker
          # users who previously had no prebuilt binary.
          - os: ubuntu-24.04-arm
            container: ubuntu:22.04
            target: aarch64-unknown-linux-gnu
            artifact: narsil-mcp-linux-aarch64
            binary: narsil-mcp
          - os: macos-latest
            container: ''
            target: x86_64-apple-darwin
            artifact: narsil-mcp-macos-x86_64
            binary: narsil-mcp
          - os: macos-latest
            container: ''
            target: aarch64-apple-darwin
            artifact: narsil-mcp-macos-aarch64
            binary: narsil-mcp
          # Pin Windows release builds to the stable VS2022 image. The
          # moving windows-latest image has broken rust-cache during hosted
          # image transitions, which can fail the binary job before compile.
          - os: windows-2022
            container: ''
            target: x86_64-pc-windows-msvc
            artifact: narsil-mcp-windows-x86_64
            binary: narsil-mcp.exe

    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl git libssl-dev pkg-config

      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rust-release-jammy"
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          $nasm = Get-ChildItem -Path "$env:ProgramFiles\NASM", "$env:ChocolateyInstall\lib\nasm" -Filter nasm.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $nasm) {
            throw "nasm.exe was not found after Chocolatey installation"
          }
          $nasm.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nasm.FullName -v

      - name: Build release binary
        run: |
          if [ -n "${{ inputs.features }}" ]; then
            cargo build --locked --release --target ${{ matrix.target }} --features "${{ inputs.features }}"
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Check Linux runtime linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/narsil-mcp"
          "$binary" --version
          ldd "$binary"
          # Fail if a future toolchain/cache introduces a newer GLIBC need.
          required=$(objdump -T "$binary" | sed -n 's/.*(GLIBC_\([0-9.]*\)).*/\1/p' | sort -Vu | tail -1)
          test -n "$required"
          test "$(printf '%s\n' "$required" 2.35 | sort -V | tail -1)" = 2.35

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$BUILD_TARGET" == *"linux"* ]]; then
            strip "target/$BUILD_TARGET/release/narsil-mcp"
          elif [[ "$BUILD_TARGET" == *"darwin"* ]]; then
            strip -x "target/$BUILD_TARGET/release/narsil-mcp"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
