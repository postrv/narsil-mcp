name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Quick checks that fail fast
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features native -- -D warnings

  # Version consistency check
  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Check version consistency
        run: |
          # Extract version from Cargo.toml
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"

          # Extract version from git tag
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Git tag version: $TAG_VERSION"

          # Compare versions
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: Version mismatch!"
            echo "  Cargo.toml: $CARGO_VERSION"
            echo "  Git tag:    v$TAG_VERSION"
            exit 1
          fi

          echo "✅ Versions match: $CARGO_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary
        run: cargo build --release

      - name: Verify binary version matches
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          BINARY_VERSION=$(./target/release/narsil-mcp --version | sed 's/narsil-mcp //')

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Binary --version:   $BINARY_VERSION"

          if [ "$BINARY_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ ERROR: Binary version mismatch!"
            echo "  Cargo.toml: $CARGO_VERSION"
            echo "  Binary:     $BINARY_VERSION"
            exit 1
          fi

          echo "✅ Binary version matches: $BINARY_VERSION"

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint, version-check]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        run: cargo audit

  # Verify tests pass before releasing
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, version-check]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true

      - name: Run tests
        run: cargo test --features native --verbose -- --test-threads=1

  # Build release binaries for all platforms
  build-binaries:
    name: Build Release Binaries
    needs: [lint, security, test]
    uses: ./.github/workflows/build-binaries.yml

  # Create GitHub Release with all binaries
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Get version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}

          # Get absolute path to release-assets directory
          RELEASE_DIR="$(pwd)/release-assets"

          for dir in artifacts/*/; do
            artifact_name=$(basename "$dir")

            (cd "$dir" && tar -czf "${RELEASE_DIR}/narsil-mcp-v${VERSION}-${artifact_name#narsil-mcp-}.tar.gz" narsil-mcp)
            # Generate SHA256
            (cd release-assets && shasum -a 256 "narsil-mcp-v${VERSION}-${artifact_name#narsil-mcp-}.tar.gz" > "narsil-mcp-v${VERSION}-${artifact_name#narsil-mcp-}.tar.gz.sha256")
          done

          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
